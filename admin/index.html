<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VisaMatch · Admin</title>
<link rel="icon" type="image/webp" href="https://lp.imigrareua.com/wp-content/uploads/2026/07/Visamatch-imigrareua.webp"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#0053d0;--blue2:#1A72F6;--blue3:#003fa3;--blue4:#002b70;--cyan:#38bdf8;--pink:#ff4b82;--txt:#0b1c30;--txt2:#424655;--txt3:#737687;--red:#dc2626;--border:rgba(194,198,216,.5)}
html,body{height:100%;font-family:'Inter Tight',sans-serif;color:var(--txt)}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;
  background:linear-gradient(150deg,#081127 0%,#0a1e46 45%,#0053d0 130%);position:relative;overflow:hidden}
.brand-top{position:relative;height:40px;margin-bottom:22px}
.brand-top img{height:100%;width:auto;display:block;filter:drop-shadow(0 4px 14px rgba(0,0,0,.35))}
body::before{content:'';position:absolute;inset:0;background:
  radial-gradient(ellipse at 80% 10%,rgba(56,189,248,.16),transparent 55%),
  radial-gradient(ellipse at 10% 90%,rgba(255,75,130,.10),transparent 50%)}
.card{position:relative;background:#fff;border-radius:20px;padding:38px 34px;width:100%;max-width:360px;
  box-shadow:0 24px 60px rgba(0,10,40,.4);border:1px solid rgba(255,255,255,.6)}
.logo{display:block;height:34px;width:auto;margin:0 auto 22px}
.title{font-family:'Manrope',sans-serif;font-size:18px;font-weight:700;color:var(--txt);text-align:center;margin-bottom:4px}
.sub{font-size:12.5px;color:var(--txt3);text-align:center;margin-bottom:26px}
.field label{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--txt2);margin-bottom:7px}
.pwd-wrap{position:relative}
.pwd-wrap input{width:100%;border:1.5px solid var(--border);border-radius:11px;padding:12px 44px 12px 14px;font-family:'Inter Tight',sans-serif;font-size:14px;color:var(--txt);outline:none;transition:all .18s;background:#f8faff}
.pwd-wrap input:focus{border-color:var(--blue2);background:#fff;box-shadow:0 0 0 4px rgba(26,114,246,.1)}
.eye-btn{position:absolute;right:13px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--txt3);padding:0;display:flex;align-items:center;transition:color .15s}
.eye-btn:hover{color:var(--blue)}
.btn{width:100%;margin-top:18px;background:linear-gradient(135deg,var(--blue2),var(--blue3));color:#fff;border:none;border-radius:11px;padding:13px;font-family:'Inter Tight',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all .18s;box-shadow:0 6px 18px rgba(0,83,208,.32)}
.btn:hover{transform:translateY(-1px);box-shadow:0 9px 24px rgba(0,83,208,.4)}
.btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
.err{background:rgba(220,38,38,.06);border:1px solid rgba(220,38,38,.18);border-radius:9px;padding:10px 13px;font-size:12px;color:var(--red);margin-bottom:16px;display:none}
.err.show{display:block}
.foot{text-align:center;font-size:10.5px;color:var(--txt3);margin-top:20px;letter-spacing:.04em}
</style>
</head>
<body>
<div class="brand-top"><img src="https://lp.imigrareua.com/wp-content/uploads/2026/07/VISA-MATCH-LOGO-HORIZONTAL-SIMBOLO-AZUL@2x.png" alt="VisaMatch" onerror="this.style.display='none'"/></div>
<div class="card">
  <div class="title">Painel Administrativo</div>
  <div class="sub">Acesso restrito à equipe</div>
  <div class="err" id="err">Senha incorreta.</div>
  <div class="field">
    <label>Senha</label>
    <div class="pwd-wrap">
      <input type="password" id="pwd" placeholder="••••••••" autocomplete="current-password"/>
      <button class="eye-btn" type="button" onclick="togglePwd()" tabindex="-1">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
  </div>
  <button class="btn" id="btn" onclick="login()">Entrar</button>
  <div class="foot">VisaMatch · ImigrarEUA</div>
</div>
<script>
const API = '/api/admin';
document.getElementById('pwd').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

function togglePwd() {
  const input = document.getElementById('pwd');
  input.type = input.type === 'password' ? 'text' : 'password';
}

if (localStorage.getItem('admin_token')) window.location.href = '/admin/dashboard.html';

async function login() {
  const pwd = document.getElementById('pwd').value.trim();
  if (!pwd) return;
  const btn = document.getElementById('btn');
  const err = document.getElementById('err');
  btn.disabled = true;
  btn.textContent = 'Verificando...';
  err.classList.remove('show');
  try {
    const res = await fetch(`${API}/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pwd })
    });
    if (!res.ok) throw new Error();
    const { token } = await res.json();
    localStorage.setItem('admin_token', token);
    window.location.href = '/admin/dashboard.html';
  } catch {
    err.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'Entrar';
  }
}
</script>
</body>
</html>
